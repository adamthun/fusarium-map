name: Fusarium ODP Adatgyűjtő

on:
  schedule:
    - cron: '45 * * * *'   # Óránkénti adatletöltés
    - cron: '0 6 * * *'    # Napi kockázatszámítás
  workflow_dispatch:
    inputs:
      date:
        description: 'Dátum YYYY-MM-DD (üres = tegnap)'
        required: false
        default: ''
      days:
        description: 'Hány napra visszamenőleg (1-7)'
        required: false
        default: '1'
      mode:
        description: 'Mode: fetch / calc / both'
        required: false
        default: 'both'

jobs:
  fetch-odp:
    name: ODP adatletöltés
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Függőségek
        run: pip install -r scripts/requirements.txt

      - name: ODP letöltés
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          DAYS="${{ github.event.inputs.days || '1' }}"
          DATE="${{ github.event.inputs.date }}"
          if [ -n "$DATE" ]; then
            python scripts/fetch_odp.py --date "$DATE" --days "$DAYS" --no-calc
          else
            python scripts/fetch_odp.py --days "$DAYS" --no-calc
          fi

  calculate-risk:
    name: Fusarium kockázatszámítás
    runs-on: ubuntu-latest
    needs: fetch-odp
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Függőségek
        run: pip install -r scripts/requirements.txt

      - name: Kockázatszámítás
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -n "$DATE" ]; then
            python scripts/calc_risk.py --date "$DATE"
          else
            python scripts/calc_risk.py
          fi

  health-check:
    name: Adatbázis ellenőrzés
    runs-on: ubuntu-latest
    needs: calculate-risk
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pip install requests
        run: pip install requests

      - name: DB státusz
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python -c "
          import os, requests
          url = os.environ['SUPABASE_URL']
          key = os.environ['SUPABASE_ANON_KEY']
          h = {'apikey': key, 'Authorization': f'Bearer {key}'}
          r = requests.get(f'{url}/rest/v1/fusarium_risk?select=calc_date&order=calc_date.desc&limit=1', headers=h)
          print('DB státusz:', r.status_code)
          if r.ok:
              print('Legfrissebb adat:', r.json())
          "

  # ── OPCIONÁLIS: Historikus backfill (csak manuálisan) ──
  backfill:
    name: Historikus backfill
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.mode == 'backfill'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r scripts/requirements.txt
      - name: Backfill 2024-2026 szezónok
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/backfill_history.py --years 2024 2025 2026
