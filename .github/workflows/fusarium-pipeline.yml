name: Fusarium ODP Adatgyűjtő

on:
  schedule:
    - cron: '45 * * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Dátum YYYY-MM-DD (üres = tegnap)'
        required: false
        default: ''
      days:
        description: 'Hány napra visszamenőleg (1-7)'
        required: false
        default: '1'
      mode:
        description: 'Mode: fetch / calc / both / backfill'
        required: false
        default: 'both'
      years:
        description: 'Backfill évek (pl: 2024 2025)'
        required: false
        default: '2025'

jobs:
  fetch-odp:
    name: ODP adatletöltés
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.mode == 'fetch' || github.event.inputs.mode == 'both'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r scripts/requirements.txt
      - name: ODP letöltés
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          DAYS="${{ github.event.inputs.days || '1' }}"
          DATE="${{ github.event.inputs.date }}"
          if [ -n "$DATE" ]; then
            python scripts/fetch_odp.py --date "$DATE" --days "$DAYS" --no-calc
          else
            python scripts/fetch_odp.py --days "$DAYS" --no-calc
          fi

  calculate-risk:
    name: Fusarium kockázatszámítás
    runs-on: ubuntu-latest
    needs: fetch-odp
    if: |
      always() && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' &&
         (github.event.inputs.mode == 'calc' || github.event.inputs.mode == 'both'))
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r scripts/requirements.txt
      - name: Kockázatszámítás
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -n "$DATE" ]; then
            python scripts/calc_risk.py --date "$DATE"
          else
            python scripts/calc_risk.py
          fi

  backfill:
    name: Historikus backfill
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.mode == 'backfill'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r scripts/requirements.txt
      - name: Backfill szezónok
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          YEARS="${{ github.event.inputs.years || '2025' }}"
          python scripts/backfill_history.py --years $YEARS --no-calc

  health-check:
    name: Adatbázis ellenőrzés
    runs-on: ubuntu-latest
    needs: calculate-risk
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: DB státusz
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python -c "
          import os, requests
          url = os.environ['SUPABASE_URL']
          key = os.environ['SUPABASE_ANON_KEY']
          h = {'apikey': key, 'Authorization': f'Bearer {key}'}
          r = requests.get(f'{url}/rest/v1/fusarium_risk?select=calc_date&order=calc_date.desc&limit=1', headers=h)
          print('DB státusz:', r.status_code, r.json())
          "
