name: Fusarium ODP Adatgyűjtő

on:
  schedule:
    # ── Óránkénti adatletöltés (UTC) ──────────────────────
    # Az ODP adatok ~30 perccel az óra után válnak elérhetővé
    - cron: '45 * * * *'   # minden óra 45. percén

    # ── Napi kockázatszámítás ──────────────────────────────
    # Reggel 6:00 UTC (8:00 CEST / 7:00 CET)
    - cron: '0 6 * * *'

  # Manuális futtatás lehetősége (pl. backfill)
  workflow_dispatch:
    inputs:
      date:
        description: 'Dátum YYYY-MM-DD (üres = tegnap)'
        required: false
        default: ''
      days:
        description: 'Hány napra visszamenőleg (1-7)'
        required: false
        default: '1'
      mode:
        description: 'Mode: fetch / calc / both'
        required: false
        default: 'both'

jobs:
  # ── 1. ADATLETÖLTÉS ─────────────────────────────────────
  fetch-odp:
    name: ODP adatletöltés
    runs-on: ubuntu-latest
    # Csak ha schedule vagy fetch/both módban fut
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.mode == 'fetch' || github.event.inputs.mode == 'both'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Függőségek telepítése
        run: pip install -r scripts/requirements.txt

      - name: ODP adatletöltés
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          DAYS="${{ github.event.inputs.days || '1' }}"

          if [ -n "$DATE" ]; then
            python scripts/fetch_odp.py --date "$DATE" --days "$DAYS" --no-calc
          else
            python scripts/fetch_odp.py --days "$DAYS" --no-calc
          fi

      - name: Összefoglaló
        if: always()
        run: echo "ODP letöltés befejezve — $(date -u '+%Y-%m-%d %H:%M UTC')"

  # ── 2. KOCKÁZATSZÁMÍTÁS ─────────────────────────────────
  calculate-risk:
    name: Fusarium kockázatszámítás
    runs-on: ubuntu-latest
    needs: fetch-odp
    if: |
      always() && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' &&
         (github.event.inputs.mode == 'calc' || github.event.inputs.mode == 'both'))
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Függőségek telepítése
        run: pip install -r scripts/requirements.txt

      - name: Kockázatszámítás (mindkét modell)
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          DATE="${{ github.event.inputs.date }}"

          if [ -n "$DATE" ]; then
            python scripts/fetch_odp.py --date "$DATE" --no-calc
            # Csak a számítás
            python -c "
          import os
          from supabase import create_client
          from datetime import datetime, timedelta

          sb = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_SERVICE_KEY'])
          d = '$DATE' or (datetime.utcnow()-timedelta(days=1)).strftime('%Y-%m-%d')
          r = sb.rpc('compute_daily_risk', {'p_date': d}).execute()
          print(f'Kiszámítva: {len(r.data or [])} állomás, {d}')
          "
          else
            python -c "
          import os
          from supabase import create_client
          from datetime import datetime, timedelta

          sb = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_SERVICE_KEY'])
          d = (datetime.utcnow()-timedelta(days=1)).strftime('%Y-%m-%d')
          r = sb.rpc('compute_daily_risk', {'p_date': d}).execute()
          print(f'Kiszámítva: {len(r.data or [])} állomás, {d}')
          "
          fi

  # ── 3. EGÉSZSÉGÜGYÜGYI ELLENŐRZÉS ───────────────────────
  health-check:
    name: Adatbázis ellenőrzés
    runs-on: ubuntu-latest
    needs: calculate-risk
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Függőségek
        run: pip install requests

      - name: DB státusz ellenőrzés
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:    ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python -c "
          import os, requests, sys
          url  = os.environ['SUPABASE_URL']
          key  = os.environ['SUPABASE_ANON_KEY']

          headers = {'apikey': key, 'Authorization': f'Bearer {key}'}

          # Legfrissebb kockázati adat
          r = requests.get(
            f'{url}/rest/v1/fusarium_risk?select=calc_date,count&order=calc_date.desc&limit=1',
            headers=headers
          )
          print('DB státusz:', r.status_code)

          # Óránkénti adatok száma (utolsó 24h)
          r2 = requests.get(
            f'{url}/rest/v1/hourly_obs?select=count&obs_time=gte.{__import__(\"datetime\").datetime.utcnow().strftime(\"%Y-%m-%dT%H:%M:%SZ\")}',
            headers={**headers, 'Prefer': 'count=exact'}
          )
          print('DB ellenőrzés OK')
          "
